<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366F1" />
    <title>Silicon — Digital Agency</title>
    <meta
      name="description"
      content="Silicon is a full-service digital agency. We make mobile apps, websites and brands that people appreciate all around the world."
    />
    <script>
      // Apply the saved / system theme before first paint to avoid a light flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('silicon-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
